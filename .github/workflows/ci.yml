name: 🚀 CodeArena CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Frontend Checks (React Native Expo & TypeScript)
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: 📱 Frontend Typecheck & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      - name: 🏗️ Verify Expo Web Export Build
        run: npm run build:web

  # ─────────────────────────────────────────────────────────────
  # Job 2: Backend Checks (Node.js & Express API)
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: ⚡ Backend Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Run Backend Unit & Algorithm Tests
        working-directory: ./backend
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 3: Security & Code Quality Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔒 Check Root Dependency Security
        run: npm audit --audit-level=critical || true

      - name: 🔒 Check Backend Dependency Security
        working-directory: ./backend
        run: npm audit --audit-level=critical || true
