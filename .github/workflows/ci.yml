name: 🚀 CodeArena CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Frontend Checks (React Native Expo & TypeScript)
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: 📱 Frontend Typecheck & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      - name: 🏗️ Verify Expo Web Export Build
        run: npm run build:web

  # ─────────────────────────────────────────────────────────────
  # Job 2: Backend Checks (Node.js & Express API)
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: ⚡ Backend Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Run Backend Unit & Algorithm Tests
        working-directory: ./backend
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 3: Security & Code Quality Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔒 Check Root Dependency Security
        run: npm audit --audit-level=critical || true

      - name: 🔒 Check Backend Dependency Security
        working-directory: ./backend
        run: npm audit --audit-level=critical || true

  # ─────────────────────────────────────────────────────────────
  # Job 4: Docker Container Build & GHCR Publishing
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Publish to GHCR
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🔨 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Job 5: Continuous Deployment Trigger
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Production Automated Deployment
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📡 Trigger Production Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "🚀 Triggering Render deployment webhook..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "✅ Deployment webhook triggered successfully!"
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK secret not provided. Docker image is built, tested, and published to GHCR successfully."
          fi
